<div class="flex pt-0 px-4 xl:p-10 xl:gap-20 sm:h-203 xs:h-203 md:h-240 gap-8 self-stretch justify-center items-center">
  <img src="../../assets/forgot-password-quote.png" class="quote-section" />

  <div class="p-0 flex xl:w-160 sm:w-93.75 xs:w-93.75 md:w-160 flex-col items-start gap-8 shrink-0">
    <img src="../../assets/logo-large.svg" />
    <div class="reset-email-title-container">
      <span class="reset-email-title">Check your inbox</span>
      <span class="reset-email-subheader"
        >We've sent a reset link to {{email()}}</span
      >
    </div>
    <div class="reset-email-input-container">
      <span>The link expires in 30 minutes.</span>

      <app-button (click)="openEmailApp()" variant="secondary">Open email app</app-button>

          <div class="reset-sub-links-container">
        <label class="already-text">Didn't receive it?</label
        ><a routerLink="" class="sign-link">Resend email</a>
      </div>
      <a (click)="resendResetLink()" class="reset-sign-link"><img src="../../assets/Back Icon.png"/>Back to sign in</a>
    </div>
  </div>
</div>

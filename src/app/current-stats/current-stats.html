<div class="flex flex-row flex-nowrap items-stretch justify-center gap-3 sm:gap-6 self-stretch w-full">
    <div class="flex-1 min-w-0 p-3 sm:p-5 flex-col flex justify-center items-start gap-2 sm:gap-8 self-stretch rounded-2xl border border-white bg-[linear-gradient(270deg,#FF5722)]">
        <span class="text-white text-[12px] sm:text-[16px] font-semibold">Total Savings</span>
        <span class="text-white text-xl sm:text-4xl md:text-[64px] font-semibold truncate">${{(sum$ | async ) ?? '0.00'}} </span>
    </div>
    <div class="flex-1 min-w-0 flex p-3 sm:p-5 gap-2 sm:gap-8 items-start flex-col rounded-2xl border border-neutral-600 bg-neutral-800">
        <span class="text-white text-[12px] sm:text-[16px] font-semibold">Active goals</span>
        @if(goalSum$ | async; as goalSum){
        <span class="text-orange-400 text-xl sm:text-4xl md:text-[64px] font-semibold">{{goalSum}}</span>

        }@else if(isLoading){
                    <div
          class="inline-block h-8 w-8 animate-spin rounded-full border-4 border-solid border-current border-e-transparent align-[-0.125em] text-surface motion-reduce:animate-[spin_1.5s_linear_infinite] dark:text-white"
          role="status">
          <span
            class="!absolute !-m-px !h-px !w-px !overflow-hidden !whitespace-nowrap !border-0 !p-0 ![clip:rect(0,0,0,0)]"
            >Loading...</span
          >
        </div>
        }@else {
        <span class="text-neutral-400 text-xl sm:text-4xl md:text-[64px] font-semibold">0</span>

        }

    </div>
    <div class="flex-1 min-w-0 flex p-3 sm:p-5 flex-col items-start gap-2 sm:gap-8 rounded-2xl border border-neutral-600 bg-neutral-800">
        <span class="text-white text-[12px] sm:text-[16px] font-semibold">Goals completed</span>
        @if(goalsCompleted$ | async; as goalsCompleted){
            <span class="text-green-500 text-xl sm:text-4xl md:text-[64px] font-semibold">{{goalsCompleted}}</span>
        }@else if(isLoading){
                    <div
          class="inline-block h-8 w-8 animate-spin rounded-full border-4 border-solid border-current border-e-transparent align-[-0.125em] text-surface motion-reduce:animate-[spin_1.5s_linear_infinite] dark:text-white"
          role="status">
          <span
            class="!absolute !-m-px !h-px !w-px !overflow-hidden !whitespace-nowrap !border-0 !p-0 ![clip:rect(0,0,0,0)]"
            >Loading...</span
          >
        </div>
        }@else {
            <span class="text-neutral-400 text-xl sm:text-4xl md:text-[64px] font-semibold">0</span>
        }

    </div>
</div>

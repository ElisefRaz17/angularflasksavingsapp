<div class="overlay" *ngIf="isOpen" (click)="closeOnBackdrop($event)">
<dialog class="container">
  <svg
    class="close-icon"
    (click)="onClose()"
    xmlns="http://www.w3.org/2000/svg"
    width="20"
    height="20"
    viewBox="0 0 20 20"
    fill="none"
  >
    <path
      d="M15 5L5 15M5 5L15 15"
      stroke="#898A8B"
      stroke-width="1.66667"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
  <span class="modal-header">{{header}}</span>
  <hr class="divider"/>
  <app-input [(ngModel)]="goalName" label="Goal name"></app-input>

  <app-input [(ngModel)]="targetAmount" label="Target amount" [icon]="faDollarSign"></app-input>
  <app-input type="date" [(ngModel)]="deadline" label="Deadline (optional)" [icon]="faCalendar"></app-input>
  <div class="action-buttons-container">
    <app-button variant="secondary">Cancel</app-button>
    <!-- <app-button (click)="actionFunction()">{{submitLabel}}</app-button> -->
  </div>
</dialog>
</div>

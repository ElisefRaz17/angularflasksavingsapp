<nav class="nav-container">
  <img src="assets/logo-large.svg" />
  <div class="flex items-center gap-1">
    <app-button
      [icon]="faPerson"
      variant="secondary"
      (onClick)="onOpenMenu()"
    ></app-button>

    <app-button type="button" class="height:24px" (onClick)="openCreateGoal()">
      <img src="assets/icon-plus.svg" />
      New Goal</app-button
    >
  </div>
</nav>

<ng-container *ngIf="isModalOpen">
  <app-goal-modal
    [isEdit]="isEditing"
    (close)="closeGoalModal()"
    (save)="handleSave($event)"
  >
  </app-goal-modal>
</ng-container>
<ng-container *ngIf="openMenu()">
  <div class="menu-container">
    <!-- <div  -->
      <app-button class="menu-item" (onClick)="handleSignOut()">Sign Out</app-button>
    <!-- </div> -->
  </div>
</ng-container>

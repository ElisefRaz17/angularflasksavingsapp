<div
    class="flex pt-0 px-4 xl:p-10 xl:gap-20 sm:h-203 xs:h-203 gap-8 self-stretch justify-center items-center"

>
  <img src="../../assets/forgot-password-quote.png" class="quote-section" />

  <div class="p-0 flex xl:w-160 sm:w-93.75  flex-col items-start gap-8 shrink-0">
    <img src="../../assets/logo-large.svg" />
    <div class="update-title-container">
      <span class="update-title">Create new password</span>
      <span class="update-subheader"
        >Your new password must be different from your previous password.</span
      >
    </div>
    <div class="update-input-container">
      <div class="password-container">
        <app-input
        [(ngModel)]="password"
          type="password"
          placeholder="New Password"
          label="New Password"
        ></app-input>
        <label class="password-subtext">At least 8 characters</label>
      </div>
      <app-input
        
      [(ngModel)]="confirmPassword"
        type="password"
        placeholder="New Password"
        label="Password"
      ></app-input>
      <p *ngIf="password !== confirmPassword && confirmPassword" style="color: red;">
        Passwords do not match
      </p>
      <app-button [disabled]="!isValid()" (click)="submitNewPassword()">Reset Password</app-button>
      <!-- <div class="sub-links-container"> -->
        <a routerLink="/login" class="sign-link">Back to sign in</a>
      <!-- </div> -->

      <!-- <button (click)="addUser()">Add User</button> -->
    </div>
  </div>
</div>

<div class="container">
  <span class="headerTitle">{{headerTitle}}</span>
  <div class="dropdown-list">
    <div class="menu-item" *ngFor="let item of options; let i = index">
      <label>
        <input
          type="radio"
          [name]="groupId"
          [value]="item.value"
          [checked]="selectedValue === item.value"
          [(ngModel)]="selectedValue"
          (ngModelChange)="onSelectionChange()"
          class="custom-radio"
        />
        {{item.label}}
      </label>
    </div>
  </div>
</div>

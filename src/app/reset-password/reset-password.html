<div class="flex pt-0 px-4 xl:p-10 xl:gap-20 sm:h-203 xs:h-203 md:h-240 gap-8 self-stretch justify-center items-center">
  <img src="../../assets/forgot-password-quote.png" class="quote-section" />

    <div class="p-0 flex xl:w-160 sm:w-93.75 xs:w-93.75 md:w-160 flex-col items-start gap-8 shrink-0">

    <img src="../../assets/logo-large.svg" />
    <div class="reset-title-container">
      <span class="reset-title">Forgot your password</span>
      <span class="reset-subheader"
        >Enter your email address and we'll send you a link to reset it.</span
      >
    </div>
    <div class="reset-input-container">
      <app-input
        [(ngModel)]="email"
        label="Email address"
      ></app-input>

      <app-button (click)="sendResetLink()" >Send reset link</app-button>

        <a routerLink="/login" class="sign-link">Back to sign in</a>


    </div>
  </div>
</div>
